<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>端午 · 历象</title><style>
:root{--bg:#FFF8EC;--paper:#FFFCF5;--ink:#35291F;--muted:#79634D;--red:#A63D26;--gold:#B3863D;--line:#E8D6BA;--wash:#F6E8D1}
[data-theme=dark]{--bg:#1F1913;--paper:#2A221A;--ink:#F2E7D5;--muted:#B9A58C;--red:#C25A3F;--gold:#C79A4F;--line:#4A3B2C;--wash:#33291F}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 56px}
.kicker{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:600;margin:0 0 10px}
h1{font-family:"Songti SC","Noto Serif SC",serif;font-weight:700;font-size:34px;line-height:1.28;margin:0 0 12px;letter-spacing:.01em}
.intro{font-size:16px;line-height:1.95;color:var(--muted);margin:0 0 22px}
.rule{height:1px;background:var(--line);margin:22px 0 18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:19px;margin:0 0 16px;box-shadow:0 1px 0 rgba(53,41,31,.03)}
h3{font-family:"Songti SC","Noto Serif SC",serif;font-size:20px;line-height:1.5;margin:0 0 10px;display:flex;align-items:baseline;gap:9px}
h3:before{content:"";width:4px;height:16px;background:var(--red);border-radius:2px;display:inline-block;flex:none}
p{font-size:15.5px;line-height:1.95;margin:0 0 10px;color:var(--ink)}p:last-child{margin-bottom:0}
ol{margin:8px 0 0;padding-left:22px}li{font-size:15px;line-height:1.9;margin:6px 0;color:var(--ink)}li::marker{color:var(--red);font-weight:700}
.note{font-size:12px;color:var(--muted);margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:700px){.wrap{padding:22px 16px 44px}h1{font-size:28px}.card{padding:17px;border-radius:20px}}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1F1913;--paper:#2A221A;--ink:#F2E7D5;--muted:#B9A58C;--red:#C25A3F;--gold:#C79A4F;--line:#4A3B2C;--wash:#33291F}}
</style></head><body><main class="wrap"><p class="kicker">一段来由 · 一点日常</p><h1>端午：在盛夏门口，系一根彩绳</h1><p class="intro">端午在农历五月初五，是夏季重要的传统节日。包粽子、赛龙舟、挂艾草、系彩绳等习俗流传至今，各地做法与口味差异很大。</p><div class="rule"></div><section class="card"><h3>端午的来由与习俗</h3><p>端午的起源有多种说法，纪念屈原是流传最广的一种；也有更早的时令避疫传统。</p><p>常见习俗包括粽子、龙舟、艾草、菖蒲、香囊、彩绳；南北口味与仪式不同。</p></section><section class="card"><h3>把端午过成一个小仪式</h3><p>不必样样齐全，选一个与家人一起完成的小动作。</p><ol><li>一起包几只粽子，或买现成的与家人分食</li><li>门口挂一小束艾草（注意过敏与消防）</li><li>给远方的家人发一句问候</li></ol></section></main></body></html>
