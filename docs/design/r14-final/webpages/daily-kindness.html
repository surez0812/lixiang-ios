<!doctype html><html lang="zh-CN" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>静心行善</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:-apple-system,"PingFang SC",sans-serif;color:var(--ink);background:var(--paper)}:root{--paper:#FFFCF5;--ink:#35291F;--muted:#79634D;--line:#E8D6BA;--wash:#F6E8D1;--red:#A63D26}html[data-theme=dark]{--paper:#30281F;--ink:#F8ECD8;--muted:#C9B69C;--line:#69523B;--wash:#403326;--red:#FFAC88}.web-article{max-width:880px;margin:0 auto;overflow:hidden}.web-hero{width:100%;height:clamp(220px,35vw,420px);object-fit:cover;object-position:center 45%;display:block}.web-prose{padding:clamp(20px,4vw,42px)}h2,h3{font-family:"Songti SC",serif}h2{font-size:clamp(26px,3vw,36px);line-height:1.4;margin:12px 0 20px}h3{font-size:20px;line-height:1.5;margin:0 0 10px}p{font-size:17px;line-height:1.9;margin:0 0 16px;overflow-wrap:break-word}.web-kicker{font-size:11px;letter-spacing:.14em;color:var(--muted)}.web-intro{font-size:18px}section{margin-top:30px}.web-note{padding:20px;border-radius:18px;background:var(--wash);font-size:14px;line-height:1.9;color:var(--muted);margin-top:30px}footer{border-top:1px solid var(--line);padding-top:24px;margin-top:30px}footer p,footer small{font-size:13px;color:var(--muted)}a{color:var(--red);text-underline-offset:3px}ol,ul{padding-left:24px;font-size:17px;line-height:1.9}img{max-width:100%}@media(min-width:850px){.web-prose{max-width:760px;margin:auto}}@media(prefers-color-scheme:dark){html:not([data-theme=light]):not([data-theme=dark]){--paper:#30281F;--ink:#F8ECD8;--muted:#C9B69C;--line:#69523B;--wash:#403326;--red:#FFAC88}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style><body><main><article class="web-article" data-owner="web"><img class="web-hero" src="../assets/winter.webp" alt="冬日庭院、雪意与灯笼"><div class="web-prose"><p class="web-kicker">一段来由 · 一点日常</p><h2>把善意，放进今天</h2><p class="web-intro">不必等一个特别的时刻。整理一处小角落，认真回应一句话，也可以是今天的小小仪式。</p><section><h3>先把心安顿下来</h3><p>找一个安静的位置，把手边的事暂时放下。给自己三次缓慢呼吸的时间。</p></section><section><h3>做一件具体的小事</h3><p>从自己能做到的事开始：扶稳一扇门，听完一次倾诉，或把公共空间整理干净。</p></section><section><h3>把这份善意带回日常</h3><p>不必记录成绩，也无需追求回报。明天想起时，再做一件小事。</p></section><aside class="web-note">各地习俗不尽相同，可以选择适合自己、愿意参与的方式。</aside><footer><h3>延伸阅读</h3><p>二十四节气与地方民俗资料。此页为设计样本，正式发布时由编辑补充具体来源及链接。</p><small>内容样本 · 更新于2026年11月12日</small></footer></div></article></main></body></html>
