<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日一签 · 动画审阅</title><style>*{box-sizing:border-box}body{margin:0;color:#35291F;background:#F1E4CE;font:14px/1.6 -apple-system,"PingFang SC",sans-serif}button{font:inherit;cursor:pointer}h1,h2,p{margin:0}h1,h2{font-family:"Songti SC",serif}.shell{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:400px 1fr;gap:40px;padding:28px}.phone{position:relative;width:375px;height:930px;border:1px solid #DFC7A4;background:radial-gradient(ellipse at 50% 45%,#F8E3B8,transparent 54%),#FFF8EC;border-radius:35px;overflow:hidden;box-shadow:0 20px 50px #5D381A18}.status{height:40px;padding:12px 23px;display:flex;justify-content:space-between;font-size:12px}.nav{display:flex;justify-content:space-between;align-items:center;padding:10px 20px}.nav a,.skip{border:1px solid #E1CEB1;background:#FFFCF5e8;border-radius:30px;padding:8px 14px;color:#5B4230;text-decoration:none;font-size:12px}.heading{text-align:center;margin-top:16px}.heading small{font-size:10px;color:#79634D;letter-spacing:.15em}.heading h1{font-size:30px;font-weight:500;letter-spacing:.12em;margin-top:5px}.heading p{color:#79634D;font-size:12px;margin-top:10px}.stage{position:absolute;left:37.5px;top:220px;width:300px;height:430px;margin:0;transition:opacity .2s}.objects{position:absolute;inset:0;transform-origin:50% 88%}.cup{position:absolute;width:103px;height:230px;left:99px;bottom:35px;object-fit:fill;filter:drop-shadow(0 14px 12px #70431B12)}.cup.back{z-index:1}.cup.front{z-index:3;clip-path:inset(12% 0 0 0);filter:none}.bamboo{position:absolute;object-fit:fill;transform-origin:50% 90%;z-index:2;width:10px;height:225px;left:145px;bottom:110px}.bamboo.other{opacity:.85;height:205px;width:9px;bottom:110px}.bamboo.one{left:132px;transform:rotate(-2deg)}.bamboo.two{left:141px;transform:rotate(-1deg);height:217px}.bamboo.three{left:157px;transform:rotate(1deg);height:209px}.bamboo.four{left:166px;transform:rotate(2deg);height:198px}.stick-aperture{position:absolute;inset:0;z-index:2;clip-path:inset(0 0 238px 0)}.glow{position:absolute;left:135px;top:60px;width:26px;height:160px;border-radius:50%;background:radial-gradient(ellipse,#FFE6A888,transparent 70%);opacity:0;filter:blur(4px);z-index:4}.result{position:absolute;inset:120px 17px auto;height:590px;opacity:0;transform:translateY(15px);pointer-events:none}.result img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.result-copy{position:relative;padding:58px 44px;text-align:center}.result-copy small{font-size:10px;color:#806447}.result-copy h2{font-size:26px;color:#9A3924;margin-top:10px}.poem{font:21px/1.85 "Songti SC",serif;margin:22px 0;color:#4D3927}.rule{height:1px;background:#DCC9A7;margin:16px 0}.explain{text-align:left;font-size:12px;line-height:1.9;color:#5B4632}.explain b{color:#9A3924}.actions{position:absolute;bottom:90px;left:28px;right:28px}.primary{border:0;border-radius:27px;background:#A43C29;color:#FFF8EC;padding:14px 18px;width:100%;font-size:14px}.hint{text-align:center;font-size:10px;color:#79634D;margin-top:14px}.review{align-self:center;color:#5B4632}.review h2{font-size:28px}.review p{font-size:14px;margin:15px 0;line-height:1.9}.review button{border:1px solid #CDB28D;background:#FFF8EC;border-radius:20px;padding:10px 16px;color:#6E472D;margin:8px 8px 8px 0}.review label{display:flex;gap:10px;align-items:center;margin:18px 0}.review input[type=range]{width:100%}.phase{font-size:12px;color:#A43C29}.backlink{display:inline-block;margin-top:20px;color:#A43C29}.capture .shell{display:block;padding:0;margin:0;width:375px}.capture .phone{border:0;border-radius:0;height:930px}.capture .review{display:none}.capture{background:#FFF8EC;width:375px}.capture .actions{bottom:90px}.capture .stage{margin-top:0}@media(max-width:760px){.shell{display:block;padding:12px}.phone{margin:auto;max-width:100%}.review{max-width:375px;margin:25px auto}}@media(prefers-reduced-motion:reduce){.stage,.result{transition:none}}</style><body><div class="shell"><section class="phone"><div class="status"><span>9:41</span><span>●●●　▰</span></div><nav class="nav"><a href="home-phone-light.html">‹ 返回</a><button class="skip" id="skip">跳过动画</button></nav><div class="heading"><small>给心，留一点空</small><h1>每日一签</h1><p>先安静片刻，再与今天相遇。</p></div><div class="stage"><div class="objects"><img class="cup back" src="assets/fortune-cup.png" alt="暖竹签筒"><div class="stick-aperture"><img class="bamboo other one" src="assets/fortune-stick.png" alt=""><img class="bamboo other two" src="assets/fortune-stick.png" alt=""><img class="bamboo other three" src="assets/fortune-stick.png" alt=""><img class="bamboo other four" src="assets/fortune-stick.png" alt=""><img class="bamboo main" src="assets/fortune-stick.png" alt="主签"></div><img class="cup front" src="assets/fortune-cup.png" alt=""></div><div class="glow"></div></div><article class="result" aria-live="polite"><img src="assets/fortune-paper.png" alt="暖纸签笺"><div class="result-copy"><small id="sign-no"></small><h2 id="sign-title" tabindex="-1"></h2><div class="poem" id="poem"></div><div class="rule"></div><div class="explain"><b>签意</b><p id="explain"></p><br><b>今日可做</b><p id="advice"></p></div></div></article><div class="actions"><button class="primary" id="draw">轻摇，遇见今日一签</button><p class="hint">同一天，保留同一结果。<br>签语是生活提示，不预言结果。</p></div></section><aside class="review"><div class="phase">待机</div><h2>暖竹签筒 · 一缕金光</h2><p>生图竹纹与纸本素材组成的分层动画。<br>点击手机里的按钮，即可播放完整过程。</p><button id="replay">回到待机</button><label><input type="checkbox" id="reduce">减少动态效果</label><label for="timeline">逐帧审阅　<span id="time-label">0ms</span></label><input type="range" id="timeline" min="0" max="1450" value="0"><p>触发 → 轻摇 → 主签升起 → 签笺展读<br>总时长约 1.45 秒，可随时跳过。</p><a class="backlink" href="index.html">返回整轮设计审核 ›</a></aside></div><script>const data={"version": 1, "contentVersion": "review-20261112-v1", "datePolicy": "Asia/Shanghai", "source": "Codex 自撰设计候选，待 Sure 审核", "signTypes": [{"id": "lixiang-original", "title": "历象生活签", "enabled": true}], "signs": [{"id": "lixiang-036", "type": "lixiang-original", "no": 36, "level": "上上", "title": "静水流深", "poem": ["静水藏深意", "清风入远林", "从容行一事", "日久见初心"], "explain": "不必急于证明自己。把一件小事做好，进展会慢慢清晰。", "advice": "留出二十分钟，完成一件搁置的小事。", "keywords": ["生活", "从容"]}, {"id": "lixiang-001", "type": "lixiang-original", "no": 1, "level": "上", "title": "晨光入室", "poem": ["晨光穿小窗", "一室有微香", "收拾案前事", "心随天色朗"], "explain": "清楚的开始，可以很小。从眼前的一角着手，让今天有一个落点。", "advice": "整理桌面，只留下今天需要的三件东西。", "keywords": ["生活", "从容"]}, {"id": "lixiang-002", "type": "lixiang-original", "no": 2, "level": "中", "title": "缓步有声", "poem": ["缓步过长街", "檐前听雨歇", "不催花早发", "自有一枝斜"], "explain": "慢一点，也能看清方向。不用拿别人的速度衡量自己。", "advice": "把今天最重要的一件事，拆成三个小步骤。", "keywords": ["生活", "从容"]}, {"id": "lixiang-003", "type": "lixiang-original", "no": 3, "level": "上", "title": "清风有信", "poem": ["清风来有信", "旧友隔山川", "一语寻常问", "温情落眼前"], "explain": "关系不一定需要盛大的表达。一个真诚的问候，足以让人感到被惦记。", "advice": "给一位久未联系的人发一句具体的问候。", "keywords": ["生活", "从容"]}, {"id": "lixiang-004", "type": "lixiang-original", "no": 4, "level": "中", "title": "留白见山", "poem": ["纸上留三寸", "远山入画中", "事无须尽满", "心可纳清风"], "explain": "不必把每一分钟填满。适当留白，才能接住新的想法。", "advice": "空出十分钟，不安排任务，安静坐一会儿。", "keywords": ["生活", "从容"]}, {"id": "lixiang-005", "type": "lixiang-original", "no": 5, "level": "上", "title": "灯下成章", "poem": ["灯下添新页", "窗前听晚风", "一行还一行", "小事亦成章"], "explain": "持续比热闹更可靠。哪怕只推进一点，也是有分量的积累。", "advice": "为正在学习的事做一次十五分钟练习。", "keywords": ["生活", "从容"]}, {"id": "lixiang-006", "type": "lixiang-original", "no": 6, "level": "中", "title": "转角看花", "poem": ["旧路行将尽", "转角见新花", "暂将眉头展", "归来饮盏茶"], "explain": "卡住的时候，不一定要更用力。换一个角度，再看眼前的问题。", "advice": "走到窗边休息，然后写下另一种做法。", "keywords": ["生活", "从容"]}, {"id": "lixiang-007", "type": "lixiang-original", "no": 7, "level": "上", "title": "竹影相扶", "poem": ["竹影连青径", "同行不必催", "扶持寻常处", "暖意自相随"], "explain": "求助并不减少你的能力。把需要说清楚，也是一种认真。", "advice": "向可信任的人提出一个具体、可回答的问题。", "keywords": ["生活", "从容"]}, {"id": "lixiang-008", "type": "lixiang-original", "no": 8, "level": "中", "title": "归舟停岸", "poem": ["归舟停小岸", "暮色落平沙", "收起今日桨", "明朝再出发"], "explain": "休息也是安排的一部分。今天做到这里，可以先告一段落。", "advice": "睡前写下明天的一件事，然后放下工作。", "keywords": ["生活", "从容"]}, {"id": "lixiang-009", "type": "lixiang-original", "no": 9, "level": "上", "title": "春意在枝", "poem": ["枝头藏小绿", "未必满园春", "照看身边事", "新意自相亲"], "explain": "变化常从细微处开始。看见已经发生的小进步，给它一点耐心。", "advice": "记下一件最近比以前做得更好的小事。", "keywords": ["生活", "从容"]}]};const $=s=>document.querySelector(s);let start=null,frame=null,completionTimer=null,selected=data.signs.find(x=>x.no===36),done=false;const times={press:180,shake:600,lift:1050,total:1450};function ease(x){return x*x*(3-2*x)}function clamp(x){return Math.max(0,Math.min(1,x))}function renderAt(ms){let press=ms<180?1-.02*Math.sin(Math.PI*ms/180):1;let s=clamp((ms-180)/420),angle=(ms>=180&&ms<600)?5*Math.sin(s*4*Math.PI)*(1-.25*s):0;let lift=ease(clamp((ms-600)/450));let reveal=ease(clamp((ms-1050)/400));$('.objects').style.transform='scale('+press+') rotate('+angle+'deg)';$('.bamboo.main').style.transform='translateY('+(-90*lift)+'px)';$('.glow').style.opacity=ms>600&&ms<1050?Math.sin(Math.PI*lift)*.6:0;$('.stage').style.opacity=1-reveal;$('.result').style.opacity=reveal;$('.result').style.transform='translateY('+(15*(1-reveal))+'px)';$('.heading').style.opacity=ms<1050?1:1-reveal;$('.phase').textContent=ms<180?'触发 · 0–180ms':ms<600?'轻摇 · 180–600ms':ms<1050?'出签 · 600–1050ms':'展读 · 1050–1450ms';$('#timeline').value=ms;$('#time-label').textContent=Math.round(ms)+'ms';if(ms>=1450){$('#draw').textContent='收好今日一签';$('#draw').disabled=false;done=true}else if(ms>0){$('#draw').disabled=true;$('#draw').textContent='与今天相遇…'}else{done=false;$('#draw').disabled=false;$('#draw').textContent='轻摇，遇见今日一签'}}
function fill(){let s=selected;$('#sign-no').textContent='第'+s.no+'签 · '+s.level;$('#sign-title').textContent=s.title;$('#poem').innerHTML=s.poem.join('<br>');$('#explain').textContent=s.explain;$('#advice').textContent=s.advice}async function pick(){let date=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date());let key='lixiang-draw-'+date;try{let stored=localStorage.getItem(key);if(stored){selected=JSON.parse(stored);fill();return}}catch(e){}let buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(date+'|lixiang-v1|'+data.contentVersion));let v=0n;for(let x of new Uint8Array(buf).slice(0,8))v=(v<<8n)+BigInt(x);let signs=[...data.signs].sort((a,b)=>a.id.localeCompare(b.id));selected=signs[Number(v%BigInt(signs.length))];try{localStorage.setItem(key,JSON.stringify(selected))}catch(e){}fill()}
function stop(){if(frame)cancelAnimationFrame(frame);if(completionTimer)clearTimeout(completionTimer);completionTimer=null;frame=null;start=null}function finish(){stop();renderAt(1450);$('#sign-title').focus()}function animate(ts){if(start===null)start=ts;let t=Math.min(1450,ts-start);renderAt(t);if(t<1450)frame=requestAnimationFrame(animate);else{stop();$('#sign-title').focus()}}$('#draw').onclick=async()=>{if(done){$('#draw').textContent='今日一签已收好';return}await pick();stop();if($('#reduce').checked||matchMedia('(prefers-reduced-motion: reduce)').matches){$('.result').style.transition='opacity 150ms';finish();return}completionTimer=setTimeout(finish,1450);frame=requestAnimationFrame(animate)};$('#skip').onclick=async()=>{await pick();finish()};$('#replay').onclick=()=>{stop();renderAt(0)};$('#timeline').oninput=e=>{stop();renderAt(+e.target.value)};$('#reduce').onchange=()=>{if($('#reduce').checked&&start!==null)finish()};window.renderAt=renderAt;fill();let params=new URLSearchParams(location.search);if(params.has('frame')){document.body.classList.add('capture');renderAt(+params.get('frame'))}
</script></body></html>
